name: Update GitHub Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a medianoche UTC
  workflow_dispatch: # Permite ejecutar el Action manualmente cuando quieras desde la pestaña Actions

jobs:
  update-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para hacer commit y push del archivo generado
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node generate-stats.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --staged --quiet || (git commit -m "build: update language stats SVG [skip ci]" && git push)
