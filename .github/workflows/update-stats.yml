name: Update Profile Stats SVG

on:
  schedule:
    - cron: '0 */2 * * *' # Se ejecuta cada 2 horas
  workflow_dispatch: # Permite ejecución manual

jobs:
  update-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute script for language stats
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node generate-stats.js

      - name: Download Streak Stats SVG
        run: |
          URLS=(
            "https://github-readme-streak-stats-eight.vercel.app/?user=IgnacioAcena23&theme=tokyonight&hide_border=true"
            "https://streak-stats.demolab.com/?user=IgnacioAcena23&theme=tokyonight&hide_border=true"
          )
          SUCCESS=0
          for url in "${URLS[@]}"; do
            echo "Intentando obtener streak SVG desde: $url"
            if curl -s -f "$url" -o streak.svg.tmp; then
              if grep -q "Total Contributions" streak.svg.tmp && ! grep -q "Failed to retrieve contributions" streak.svg.tmp; then
                mv streak.svg.tmp streak.svg
                echo "Streak stats actualizado con éxito."
                SUCCESS=1
                break
              else
                echo "El SVG contiene un mensaje de error o formato inválido, probando siguiente..."
                rm -f streak.svg.tmp
              fi
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "No se pudo actualizar streak.svg en este intento, conservando archivo previo."
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages.svg streak.svg
          git diff --staged --quiet || (git commit -m "build: update profile stats [skip ci]" && git pull --rebase origin main && git push)
